name: smart_syringe_pump
description: EleCare - Smart Syringe Pump Monitoring Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bluetooth_serial: ^0.4.0
  provider: ^6.1.2
  fl_chart: ^0.69.0
  flutter_local_notifications: ^17.2.3
  just_audio: ^0.9.40
  flutter_ringtone_player: ^4.0.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.13.1
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  camera: ^0.11.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/elecare_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
    - assets/data/
